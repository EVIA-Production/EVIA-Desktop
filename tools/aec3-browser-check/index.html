<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Deliberately the STRICTEST CSP in the app - copied from overlay.html.
      The main window that actually runs audio capture has no CSP meta tag at
      all, so if AEC3 loads under this one it loads everywhere. Note there is
      no 'unsafe-eval': emscripten's single eval() call sits in a Node-only
      wasm2js fallback, and this page is what proves it never runs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>AEC3 browser check</title>
    <style>
      body { font: 13px ui-monospace, monospace; padding: 24px; background: #111; color: #ddd; }
      h1 { font-size: 15px; color: #fff; }
      .pass { color: #4ade80; } .fail { color: #f87171; } .note { color: #888; }
      pre { line-height: 1.7; }
    </style>
  </head>
  <body>
    <h1>WebRTC AEC3 — browser environment check</h1>
    <p class="note">
      Confirms the canceller loads and cancels in a real Chromium renderer over
      file://, under the app's strictest CSP, with the WASM decoded from the
      embedded base64 rather than fetched. The Node bench cannot test any of that.
    </p>
    <pre id="out">running…</pre>
    <script type="module" src="./check.ts"></script>
  </body>
</html>

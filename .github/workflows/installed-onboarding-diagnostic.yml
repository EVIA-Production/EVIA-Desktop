name: Installed onboarding diagnostic (Windows)

# Runs the installed Taylos under cdb with native glass forced on, an isolated
# profile, a fake backend and external network blocked, and prints the faulting
# stack. No production account; nothing is installed or changed.
on:
  push:
    branches: [diag/windows-installed-onboarding]

jobs:
  diagnose:
    runs-on: [self-hosted, windows-signing]
    timeout-minutes: 20
    steps:
      - name: Debug the glass crash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'D:\taylos-diag'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $exe = @('C:\Program Files\Taylos\Taylos.exe', (Join-Path $env:LOCALAPPDATA 'Programs\Taylos\Taylos.exe'), (Join-Path $env:GITHUB_WORKSPACE 'dist\win-unpacked\Taylos.exe')) | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "app: $exe version=$((Get-Item $exe).VersionInfo.ProductVersion)"
          $cdb = @('C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe', 'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$cdb) { $cdb = (Get-Command cdb.exe -ErrorAction SilentlyContinue).Source }
          Write-Host "cdb: $cdb"
          $winget = Get-ChildItem -Path 'C:\Program Files\WindowsApps' -Filter 'Microsoft.WinDbg*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($winget) { Write-Host "windbg app: $($winget.FullName)" }

          $mock = Start-Job -ScriptBlock {
            $l = New-Object System.Net.HttpListener; $l.Prefixes.Add('http://127.0.0.1:18080/'); $l.Start()
            while ($l.IsListening) { $c = $l.GetContext(); $p = $c.Request.Url.AbsolutePath; $code = 404; $body = '{"detail":"Not Found"}'
              if ($p -like '/stripe/subscription-status*') { $code = 200; $body = '{"status":"active","is_active":true,"trial_ends_at":null,"current_period_end":"2099-01-01T00:00:00Z","cancel_at_period_end":false,"plan_type":"monthly"}' }
              elseif ($p -like '/users/me*') { $code = 200; $body = '{"username":"diag","email":"diag@example.invalid","full_name":"Diag","disabled":false,"is_active":true}' }
              $b = [Text.Encoding]::UTF8.GetBytes($body); $c.Response.StatusCode = $code; $c.Response.ContentType = 'application/json'; $c.Response.OutputStream.Write($b, 0, $b.Length); $c.Response.Close() } }
          Start-Sleep -Seconds 2
          $env:TAYLOS_BACKEND_URL = 'http://127.0.0.1:18080'
          $env:TAYLOS_NATIVE_GLASS = '1'
          $env:TAYLOS_GLASS_TRACE = '1'
          $trace = Join-Path $env:TEMP 'taylos-windows-glass-native.log'
          Remove-Item $trace -ErrorAction SilentlyContinue
          $profile = Join-Path $root ('profile-cdb-' + (Get-Date -Format 'HHmmss'))
          $out = Join-Path $root 'cdb.txt'
          if ($cdb) {
            $cmd = '.sympath srv*D:\symcache*https://msdl.microsoft.com/download/symbols;.reload /f Windows.UI.Composition.dll dcomp.dll combase.dll ntdll.dll KERNELBASE.dll user32.dll win32u.dll;.lines -d;.echo ===EXCEPTION===;.exr -1;.ecxr;r;.echo ===STACK===;kv 60;.echo ===ALLTHREADS===;~*kc 25;.echo ===MODULES===;lm o;q'
            $p = Start-Process -FilePath $cdb -ArgumentList @('-g','-G','-xd','av','-xd','ch','-xd','sov','-xd','eh','-xd','clr','-c',"`"$cmd`"",'-logo',$out,"`"$exe`"","--user-data-dir=$profile",'--proxy-server=http://127.0.0.1:9') -PassThru -WindowStyle Hidden
            if (-not $p.WaitForExit(150000)) { Write-Host 'cdb still running after 150 s; killing'; & taskkill /PID $p.Id /T /F | Out-Null }
            Write-Host "--- cdb log ---"
            if (Test-Path $out) { Get-Content $out | Where-Object { $_ -notmatch 'eyJ|Bearer|token=' } | Select-Object -Last 260 }
          } else {
            Write-Host 'No cdb on this PC. Running without a debugger.'
            $p = Start-Process -FilePath $exe -ArgumentList @("--user-data-dir=$profile",'--proxy-server=http://127.0.0.1:9','--enable-logging=stderr') -RedirectStandardError (Join-Path $root 'err.txt') -RedirectStandardOutput (Join-Path $root 'out.txt') -PassThru
            $null = $p.Handle; $null = $p.WaitForExit(40000)
            Write-Host ("exit: {0} 0x{0:X8}" -f $p.ExitCode)
          }
          Get-Process -Name Taylos -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.StartTime -gt (Get-Date).AddMinutes(-4) } | ForEach-Object { & taskkill /PID $_.Id /T /F | Out-Null }
          Write-Host "--- native glass trace ---"
          if (Test-Path $trace) { Get-Content $trace | Select-Object -Last 80 }
          Write-Host "--- presentation log ---"
          $log = Join-Path $profile 'logs\onboarding-presentation.log'
          if (Test-Path $log) { Get-Content $log | ForEach-Object { $_.Substring(0, [Math]::Min(220, $_.Length)) } }
          Stop-Job $mock -ErrorAction SilentlyContinue; Remove-Job $mock -Force -ErrorAction SilentlyContinue
          exit 0

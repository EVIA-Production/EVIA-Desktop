name: Installed onboarding diagnostic (Windows)

# Reads the 1.0.126 candidate test logs Codex saved on this PC and prints the
# lines that decide material, auth state and Ask geometry. No checkout, so the
# runner workspace (and its dist folder) is left untouched. Tokens are redacted.
on:
  push:
    branches: [diag/windows-installed-onboarding]

jobs:
  diagnose:
    runs-on: [self-hosted, windows-signing]
    timeout-minutes: 10
    steps:
      - name: Print the decisive log lines
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $redact = 'eyJ[A-Za-z0-9_\-\.]+|Bearer\s+\S+|token=[^&\s]+|"token":"[^"]+"'
          $redact = 'eyJ[A-Za-z0-9_\-\.]+|Bearer\s+\S+|token=[^&\s]+|"token":"[^"]+"'
          foreach ($name in 'taylos-126-B-err.log','taylos-126-A-err.log') {
            $file = Join-Path $env:TEMP $name
            Write-Host "===== ${name} - every renderer line from 'Starting stream' to 'Auto-focusing input after response' ====="
            $lines = Get-Content $file
            $on = $false
            foreach ($line in $lines) {
              if ($line -match 'Starting stream') { $on = $true }
              if ($on) { Write-Host (($line -replace $redact, '<redacted>') -replace '^\[[^\]]+\] ', '').Substring(0, [Math]::Min(300, $line.Length)) }
              if ($on -and $line -match 'Auto-focusing input after response') { break }
            }
          }
          exit 0

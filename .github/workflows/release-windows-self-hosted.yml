name: Windows Desktop Release (Self-hosted Signing)

on:
  workflow_call:
    inputs:
      upload:
        description: "Upload Taylos.exe, Taylos.exe.blockmap, and latest.yml to the matching GitHub release"
        required: false
        default: false
        type: boolean
      ws_url:
        description: "Production websocket URL baked into the renderer"
        required: false
        default: "wss://backend-rt.livelydesert-1db1c46d.westeurope.azurecontainerapps.io"
        type: string
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload Taylos.exe, Taylos.exe.blockmap, and latest.yml to the matching GitHub release"
        required: false
        default: false
        type: boolean
      ws_url:
        description: "Production websocket URL baked into the renderer"
        required: false
        default: "wss://backend-rt.livelydesert-1db1c46d.westeurope.azurecontainerapps.io"
        type: string

permissions:
  contents: write

concurrency:
  group: windows-desktop-release-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-and-optionally-upload:
    runs-on: [self-hosted, windows-signing]
    timeout-minutes: 120
    steps:
      # A candidate under manual test runs from this workspace's dist folder and
      # locks its files; checkout's clean then fails after minutes of retries
      # (7 Oct 2026). Only processes started from this workspace are stopped.
      - name: Stop test instances running from this workspace
        shell: powershell
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { Write-Host "Stopping $($_.Name) ($($_.Id)) from the workspace"; Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      # The bridge release (once): this PC signs with the certificate every
      # installed app accepts today, while the build already names the new
      # releases feed and both certificates (release-windows-signed.ps1 runs
      # scripts/configure-release-target.js). Unset variables change nothing.
      - name: Build and verify signed Windows release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          WIN_PUBLISHER_NAMES: ${{ vars.WIN_PUBLISHER_NAMES }}
          VITE_BACKEND_WS_URL: ${{ inputs.ws_url || vars.VITE_BACKEND_WS_URL || 'wss://backend-rt.livelydesert-1db1c46d.westeurope.azurecontainerapps.io' }}
        run: |
          $args = @()
          if ("${{ inputs.upload }}" -eq "true") {
            $args += "-Upload"
          }
          powershell -ExecutionPolicy Bypass -File .\scripts\release-windows-signed.ps1 @args

      - name: Also publish to the releases repository
        if: inputs.upload && vars.RELEASES_REPO != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$RELEASES_REPO" --draft --title "Taylos ${VERSION}" --notes "Taylos ${VERSION}"
          fi
          gh release upload "$TAG" --repo "$RELEASES_REPO" --clobber dist/Taylos.exe dist/Taylos.exe.blockmap dist/latest.yml
          node scripts/finalize-release-if-complete.js "$TAG" "$RELEASES_REPO"

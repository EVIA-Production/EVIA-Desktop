name: Onboarding presentation diagnostic (Windows)

# Diagnostic only: runs the isolated onboarding presentation on the Windows
# signing PC with extra tracing. No signing, no installer, no release, no upload
# beyond the workflow's own log artifact.
on:
  push:
    branches:
      - "diag/windows-onboarding-*"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, windows-signing]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
      - name: Install dependencies
        shell: powershell
        run: npm ci
      - name: Build the Windows glass bridge
        shell: powershell
        run: npm run build:native:glass
      - name: Release presentation check (native glass auto)
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "node_modules\.bin\electron.cmd tools\onboarding-presentation-check.cjs ""$env:RUNNER_TEMP\taylos-check-auto"" > ""$env:RUNNER_TEMP\diag-check-auto.log"" 2>&1"
          Write-Host "electron exit code: $LASTEXITCODE"
          Get-Content "$env:RUNNER_TEMP\diag-check-auto.log"
          exit 0
      - name: Diagnose with native glass forced on
        shell: powershell
        continue-on-error: true
        env:
          TAYLOS_ONBOARDING_NATIVE_GLASS: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "node_modules\.bin\electron.cmd tools\onboarding-presentation-diagnose.cjs ""$env:RUNNER_TEMP\taylos-diag-glass-on"" > ""$env:RUNNER_TEMP\diag-glass-on.log"" 2>&1"
          Write-Host "electron exit code: $LASTEXITCODE"
          Get-Content "$env:RUNNER_TEMP\diag-glass-on.log"
          exit 0
      - name: Diagnose with native glass auto
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "node_modules\.bin\electron.cmd tools\onboarding-presentation-diagnose.cjs ""$env:RUNNER_TEMP\taylos-diag-auto"" > ""$env:RUNNER_TEMP\diag-auto.log"" 2>&1"
          Write-Host "electron exit code: $LASTEXITCODE"
          Get-Content "$env:RUNNER_TEMP\diag-auto.log"
          exit 0
      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-presentation-diagnosis
          path: |
            ${{ runner.temp }}/diag-*.log
            ${{ runner.temp }}/taylos-diag-*
            ${{ runner.temp }}/taylos-check-*
          if-no-files-found: warn
